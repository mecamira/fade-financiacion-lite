# nginx para financiacion.fade.es (lo instala scripts/configurar-https.sh).
# Requiere el certificado de Let's Encrypt ya emitido en /etc/letsencrypt/live/.

# HTTP: solo para la validación de Let's Encrypt; todo lo demás va a HTTPS.
# Es el servidor por defecto, así que http://IP también acaba en el dominio.
server {
    listen 80 default_server;
    server_name financiacion.fade.es _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://financiacion.fade.es$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name financiacion.fade.es;

    ssl_certificate     /etc/letsencrypt/live/financiacion.fade.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/financiacion.fade.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
